<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title">
  <title id="title">Counter app preview</title>
  <rect width="960" height="600" fill="#f4f4f4"/>
  <g font-family="system-ui, sans-serif" fill="#222" text-anchor="middle">
    <text x="480" y="215" font-size="32" font-weight="700">Counter</text>
    <text x="480" y="320" font-size="76">0</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="20" fill="#222" text-anchor="middle">
    <rect x="331" y="356" width="64" height="52" rx="5" fill="#fff" stroke="#777"/>
    <text x="363" y="390">−</text>
    <rect x="403" y="356" width="64" height="52" rx="5" fill="#fff" stroke="#777"/>
    <text x="435" y="390">+</text>
    <rect x="475" y="356" width="100" height="52" rx="5" fill="#fff" stroke="#777"/>
    <text x="525" y="390">Reset</text>
  </g>
</svg>
